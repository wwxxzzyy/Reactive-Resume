<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#F8F7F3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#100F0C" media="(prefers-color-scheme: dark)" />
		<!-- Apply the saved or system theme before first paint, so nothing flashes. Mirrors libs/theme.ts. -->
		<script>
			(() => {
				try {
					const match = document.cookie.match(/(?:^|; )theme=([^;]*)/);
					const theme = match ? decodeURIComponent(match[1]) : "system";
					const dark =
						theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					document.documentElement.classList.toggle("dark", dark);
				} catch {
					// Without cookies or matchMedia the page starts light, and the app corrects it once it loads.
				}
			})();
		</script>
		<!-- The CSP has no 'unsafe-eval', so zod can't compile its parsers. Turning that off before any module loads also
		     skips zod's `new Function` probe, which the browser reports as a CSP violation even though zod catches it. -->
		<script>
			globalThis.__zod_globalConfig = { jitless: true };
		</script>
		<meta name="application-name" content="DipperGo" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="DipperGo" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="author" content="DipperGo" />
		<meta name="rating" content="general" />
		<meta name="revisit-after" content="3 days" />
		<meta name="distribution" content="global" />
		<meta name="coverage" content="Worldwide" />
		<meta name="format-detection" content="telephone=no" />
		<meta name="language" content="English" />
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
		<meta
			name="keywords"
			content="free resume builder, ATS resume builder, ATS resume checker, ATS resume scanner, AI resume maker, free CV maker online, ATS friendly resume templates, resume builder PDF download, Word DOCX resume, resume tailor, job application tracker, curriculum vitae maker, DipperGo"
		/>
		<!-- Keep the homepage description between 120 and 160 characters. -->
		<meta
			name="description"
			content="Create professional, recruiter-approved resumes that beat ATS screeners. 12 free ATS templates, live keyword scoring, AI tailoring, and instant vector PDF &amp; Word DOCX downloads."
		/>

		<!-- OpenGraph baseline tags -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="DipperGo" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="Free ATS Resume Builder &amp; AI Resume Maker (PDF &amp; Word) | DipperGo" />
		<meta
			property="og:description"
			content="Create professional, recruiter-approved resumes that beat ATS screeners. 12 free ATS templates, live keyword scoring, AI tailoring, and instant vector PDF &amp; Word DOCX downloads."
		/>
		<meta property="og:url" content="https://dippergo.com/" />
		<meta property="og:image" content="https://dippergo.com/opengraph/banner.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="DipperGo - Free ATS Resume Builder &amp; AI Resume Maker" />

		<!-- Twitter Card baseline tags -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:site" content="@dippergo" />
		<meta name="twitter:creator" content="@dippergo" />
		<meta name="twitter:title" content="Free ATS Resume Builder (No Paywall, No Credit Card) | DipperGo" />
		<meta
			name="twitter:description"
			content="100% free open-source ATS resume builder. No paywalls, subscriptions, or credit card required. 12 ATS templates, live keyword score, AI tailoring, and free vector PDF &amp; Word DOCX downloads."
		/>
		<meta name="twitter:image" content="https://dippergo.com/opengraph/banner.jpg" />
		<meta name="twitter:image:alt" content="DipperGo - Free ATS Resume Builder (No Paywall)" />

		<link rel="canonical" href="https://dippergo.com/" />
		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="128x128" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="256x256 any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>Free ATS Resume Builder (No Paywall, No Credit Card) | DipperGo</title>
	</head>
	<body>
		<!-- Empty here; the server prerenders the homepage into it (apps/server/src/static/web.ts). -->
		<div id="app"></div>
		<!-- Branded first paint; hidden once React populates #app (higher-specificity rule below). -->
		<div id="initial-loader">
			<img class="initial-loader__logo-light" src="/icon/light.svg?v=4" width="48" height="48" alt="DipperGo" />
			<img class="initial-loader__logo-dark" src="/icon/dark.svg?v=4" width="48" height="48" alt="" />
			<div class="initial-loader__spinner"></div>
			<span class="initial-loader__sr-only">Loading</span>
		</div>
		<style>
			@keyframes app-spin {
				to {
					transform: rotate(360deg);
				}
			}
			#initial-loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				background: #f8f7f3;
			}
			html.dark #initial-loader {
				background: #100f0c;
			}
			.initial-loader__logo-dark,
			html.dark .initial-loader__logo-light {
				display: none;
			}
			html.dark .initial-loader__logo-dark {
				display: block;
			}
			#app:not(:empty) ~ #initial-loader {
				display: none;
			}
			.initial-loader__spinner {
				width: 24px;
				height: 24px;
				border: 2px solid rgba(28, 27, 21, 0.2);
				border-top-color: #1c1b15;
				border-radius: 9999px;
				animation: app-spin 0.7s linear infinite;
			}
			html.dark .initial-loader__spinner {
				border-color: rgba(239, 238, 235, 0.2);
				border-top-color: #efeeeb;
			}
			.initial-loader__sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
			}
		</style>
		<script type="module" data-cfasync="false" src="/src/main.tsx"></script>
	</body>
</html>
